name: Publish SDK Packages

# The API contract (spec/sdk.openapi.json) is committed here by rundit-back. A change
# to it on develop/production drives generation, checking, and publishing.
#   develop    -> dist-tag rc       (preview of the next stable)
#   production -> dist-tag latest   (stable release)
on:
  push:
    branches: [develop, production]
    paths: ['spec/sdk.openapi.json']
  workflow_dispatch:
    inputs:
      allow_breaking:
        description: Allow breaking changes vs the channel's published spec (intentional major cut, e.g. v1 -> v2)
        type: boolean
        default: false
      force_publish:
        description: Publish even if the generated surface already matches the channel's dist-tag
        type: boolean
        default: false
      redeploy_mcp_only:
        description: Rebuild MCP from the existing channel release without publishing SDK packages
        type: boolean
        default: false

concurrency:
  group: sdk-publish-${{ github.ref }}
  # Finish publishing and handing off to MCP before starting the next release.
  cancel-in-progress: false

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance via OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          # Resolve the current branch after acquiring the release slot.
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (tokenless, OIDC) needs npm >= 11.5.1; Node 24 ships an
      # older npm. No NODE_AUTH_TOKEN is set — provenance + auth come from OIDC.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check MCP rebuild automation
        run: node --test scripts/redeploy-mcp.test.cjs

      - name: Resolve channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == 'production' ]]; then
            echo 'dist_tag=latest' >> "$GITHUB_OUTPUT"
          else
            echo 'dist_tag=rc' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SDK from committed spec
        if: inputs.redeploy_mcp_only != true
        run: npm run sdk:generate

      - name: Decide whether to publish
        id: drift
        shell: bash
        run: |
          if [[ "$REDEPLOY_MCP_ONLY" == 'true' ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Rebuilding MCP from the existing npm release; SDK publishing skipped.'
            exit 0
          fi

          # Publish only when the generated surface differs from what's already on the
          # channel's dist-tag (or when forced). detect-drift prints true/false.
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ inputs.force_publish }}" == 'true' ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'force_publish requested.'
            exit 0
          fi
          DRIFT="$(node scripts/detect-drift.cjs ${{ steps.channel.outputs.dist_tag }})"
          if [[ "$DRIFT" == 'true' ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "Surface differs from @${{ steps.channel.outputs.dist_tag }}; publishing."
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Surface matches @${{ steps.channel.outputs.dist_tag }}; nothing to publish."
          fi
        env:
          REDEPLOY_MCP_ONLY: ${{ inputs.redeploy_mcp_only }}

      - name: Check SDK surface for internal leaks
        if: steps.drift.outputs.publish == 'true'
        run: npm run sdk:check-surface

      - name: Check runtime wire contract
        if: steps.drift.outputs.publish == 'true'
        run: npm run sdk:check-wire-contract

      - name: Breaking-change gate (vs this channel's published spec)
        if: steps.drift.outputs.publish == 'true'
        run: npm run sdk:check-compatibility
        env:
          # Protect the consumers already on this channel. A v1 -> v2 style cut is
          # breaking vs latest and requires allow_breaking on a dispatched release.
          SDK_DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
          SDK_ALLOW_BREAKING: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_breaking || 'false' }}

      - name: Classify version bump
        id: bump
        if: steps.drift.outputs.publish == 'true'
        shell: bash
        # TRANSITIONAL: pinned to `patch` while `latest` is still the v1 line (0.2.0).
        # classify-bump compares vs `latest` and over-reports (breaking -> minor) until
        # v2 is on latest. With versions.json at 0.3.0 this yields the 0.3.x line —
        # rc = 0.3.1-rc.N, first stable = 0.3.1 — which also sidesteps the legacy
        # 0.3.0-rc.* collisions. Restore `node scripts/classify-bump.cjs latest` once
        # latest is on v2.
        run: echo "type=patch" >> "$GITHUB_OUTPUT"

      - name: Publish SDK packages
        id: publish
        if: steps.drift.outputs.publish == 'true'
        run: |
          npm run sdk:version:bump -- ${{ steps.bump.outputs.type }}
          npm run sdk:generate
          npm run sdk:publish
        env:
          SDK_NPM_DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
          # A rerun supersedes a partial rc publish with a fresh version.
          SDK_PRERELEASE_ITERATION: ${{ github.run_number }}.${{ github.run_attempt }}

      - name: Rebuild hosted MCP from published SDK
        if: steps.publish.outcome == 'success' || inputs.redeploy_mcp_only == true
        timeout-minutes: 10
        shell: bash
        run: |
          if [[ "$SDK_PUBLISHED" == 'true' ]]; then
            VERSION="$(node -p 'require("./packages/client/package.json").version')"
            node scripts/redeploy-mcp.cjs "$SDK_DIST_TAG" "$VERSION"
          else
            node scripts/redeploy-mcp.cjs "$SDK_DIST_TAG"
          fi
        env:
          SDK_DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
          SDK_PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          CLOUD66_MCP_REDEPLOY_HOOK_TEST: ${{ secrets.CLOUD66_MCP_REDEPLOY_HOOK_TEST }}
          CLOUD66_MCP_REDEPLOY_HOOK_PROD: ${{ secrets.CLOUD66_MCP_REDEPLOY_HOOK_PROD }}
