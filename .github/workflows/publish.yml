name: Publish SDK Packages

# The API contract (spec/sdk.openapi.json) is committed here by rundit-back. A change
# to it on develop/production drives generation, checking, and publishing.
#   develop    -> dist-tag rc       (preview of the next stable)
#   production -> dist-tag latest   (stable release)
on:
  push:
    branches: [develop, production]
    paths:
      - 'spec/sdk.openapi.json'
      - 'release-notes/*.json'
  workflow_dispatch:
    inputs:
      allow_breaking:
        description: Allow breaking changes vs the channel's published spec (intentional major cut, e.g. v1 -> v2)
        type: boolean
        default: false
      force_publish:
        description: Publish even if the generated surface already matches the channel's dist-tag
        type: boolean
        default: false

concurrency:
  group: sdk-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit regenerated packages + versions.json on release
      id-token: write # npm provenance via OIDC trusted publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (tokenless, OIDC) needs npm >= 11.5.1; Node 24 ships an
      # older npm. No NODE_AUTH_TOKEN is set — provenance + auth come from OIDC.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Resolve channel
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == 'production' ]]; then
            echo 'channel=release' >> "$GITHUB_OUTPUT"
            echo 'dist_tag=latest' >> "$GITHUB_OUTPUT"
          else
            echo 'channel=rc' >> "$GITHUB_OUTPUT"
            echo 'dist_tag=rc' >> "$GITHUB_OUTPUT"
          fi

      - name: Load stable release state for rc
        if: steps.channel.outputs.channel == 'rc'
        shell: bash
        run: |
          INDEX="$RUNNER_TEMP/sdk-release-index.json"
          VERSIONS="$RUNNER_TEMP/sdk-stable-versions.json"
          if git cat-file -e origin/production:releases/index.json 2>/dev/null; then
            git show origin/production:releases/index.json > "$INDEX"
          else
            echo '[]' > "$INDEX"
          fi
          if git cat-file -e origin/production:versions.json 2>/dev/null; then
            git show origin/production:versions.json > "$VERSIONS"
          else
            cp versions.json "$VERSIONS"
          fi
          echo "SDK_RELEASE_INDEX_FILE=$INDEX" >> "$GITHUB_ENV"
          echo "SDK_STABLE_VERSIONS_FILE=$VERSIONS" >> "$GITHUB_ENV"

      - name: Generate SDK from committed spec
        run: npm run sdk:generate

      - name: Decide whether to publish
        id: drift
        shell: bash
        run: |
          # Publish only when the generated surface differs from what's already on the
          # channel's dist-tag (or when forced). detect-drift prints true/false.
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "${{ inputs.force_publish }}" == 'true' ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'force_publish requested.'
            exit 0
          fi
          DRIFT="$(node scripts/detect-drift.cjs ${{ steps.channel.outputs.dist_tag }})"
          PENDING_NOTES="$(node scripts/release-notes.cjs pending)"
          if [[ "$DRIFT" == 'true' ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo "Surface drift=$DRIFT, pending release notes=$PENDING_NOTES; publishing."
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Surface drift=$DRIFT, pending release notes=$PENDING_NOTES; nothing to publish on this channel."
          fi

      - name: Require consumer release notes
        if: steps.drift.outputs.publish == 'true'
        shell: bash
        run: |
          npm run release:check
          [[ "$(node scripts/release-notes.cjs pending)" == 'true' ]] || {
            echo 'A publishable SDK change requires an unreleased release-notes/*.json file.' >&2
            exit 1
          }

      - name: Check SDK surface for internal leaks
        if: steps.drift.outputs.publish == 'true'
        run: npm run sdk:check-surface

      - name: Check runtime wire contract
        if: steps.drift.outputs.publish == 'true'
        run: npm run sdk:check-wire-contract

      - name: Classify version bump
        id: bump
        if: steps.drift.outputs.publish == 'true'
        shell: bash
        run: |
          # Both channels classify against the stable contract. This makes every RC
          # a preview of the exact version production will publish for the same spec.
          CLASSIFICATION="$(node scripts/classify-bump.cjs latest --json)"
          AUTOMATIC="$(node -p 'JSON.parse(process.argv[1]).bump' "$CLASSIFICATION")"
          TYPE="$(node scripts/release-notes.cjs bump "$CLASSIFICATION")"
          echo "Automatic surface bump=$AUTOMATIC; release-note-aware bump=$TYPE"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Verify compatibility classification
        if: steps.drift.outputs.publish == 'true'
        run: npm run sdk:check-compatibility
        env:
          SDK_DIST_TAG: latest
          # A validated breaking note makes the computed bump major after 1.0, so
          # that release can proceed automatically. The manual escape hatch remains
          # available for comparator gaps and still receives a major note-driven bump.
          SDK_ALLOW_BREAKING: ${{ steps.bump.outputs.type == 'major' || (github.event_name == 'workflow_dispatch' && inputs.allow_breaking) || 'false' }}

      - name: Publish rc (develop)
        if: steps.drift.outputs.publish == 'true' && steps.channel.outputs.channel == 'rc'
        # rc artifacts are previews; not committed back. The version is
        # bump(lastStable, type)-rc.<run_number>.
        run: |
          npm run sdk:generate
          npm run sdk:publish
        env:
          SDK_PRERELEASE_CHANNEL: rc
          SDK_PRERELEASE_BUMP: ${{ steps.bump.outputs.type }}
          SDK_PRERELEASE_ITERATION: ${{ github.run_number }}
          SDK_NPM_DIST_TAG: rc

      - name: Publish release (production)
        id: publish_release
        if: steps.drift.outputs.publish == 'true' && steps.channel.outputs.channel == 'release'
        # Bump versions.json by the classified type, bake it into the packages, publish
        # to the latest tag, then commit the authoritative generated source below.
        run: |
          npm run sdk:version:bump -- ${{ steps.bump.outputs.type }}
          npm run sdk:generate
          npm run release:prepare -- latest
          npm run sdk:publish

      - name: Commit released SDK source
        if: steps.drift.outputs.publish == 'true' && steps.channel.outputs.channel == 'release'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages versions.json CHANGELOG.md releases/index.json
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "chore: publish SDK packages [skip ci]"
          git push

      - name: Publish stable GitHub releases
        if: steps.drift.outputs.publish == 'true' && steps.channel.outputs.channel == 'release'
        run: npm run release:github

      - name: Reconcile stable GitHub releases
        # A no-drift manual dispatch can retry GitHub release creation after npm
        # publishing without bumping or republishing the packages. Never create a
        # release for a new version unless its npm publication completed.
        if: ${{ always() && !cancelled() && steps.channel.outputs.channel == 'release' && (steps.drift.outputs.publish != 'true' || steps.publish_release.outcome == 'success') }}
        run: npm run release:sync-github
