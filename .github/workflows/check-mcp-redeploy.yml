name: Check MCP rebuild automation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/redeploy-mcp*'
  push:
    branches: [develop, production]
    paths:
      - '.github/workflows/**'
      - 'scripts/redeploy-mcp*'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test scripts/redeploy-mcp.test.cjs
